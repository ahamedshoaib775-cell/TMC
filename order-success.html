<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Placed – TMC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .success-box{
      max-width:600px;
      margin:100px auto;
      padding:50px;
      text-align:center;
      background:#fff;
      border-radius:18px;
      box-shadow:0 20px 50px rgba(0,0,0,.1)
    }
    .success-box h1{font-size:42px;margin-bottom:10px}
    .success-box p{color:#666;margin-bottom:30px}
    .success-box a{
      display:inline-block;
      padding:12px 26px;
      border-radius:10px;
      background:#533cff;
      color:#fff;
      text-decoration:none;
      font-weight:600
    }
  </style>
</head>

<body>

<header class="header"></header>

<main>
  <div class="success-box">
    <h1>🎉 Order Confirmed</h1>
    <p>Thank you for shopping with TMC.<br>Your order will be shipped soon.</p>
    <a href="index.html">Continue Shopping</a>
  </div>
</main>

<footer class="footer"></footer>

</body>
</html>
