<!-- SEARCH BOX -->
<div class="category-search">
  <input 
    type="text" 
    id="searchInput"
    placeholder="Search hijabs, styles, fabrics…"
    onkeyup="searchHijabs()"
  >
</div>

<main>

    <!-- HERO -->
    <section class="category-hero">
        <h1 style="align-items: center;" >Hijabs</h1>
        <p >Elegant hijabs crafted with premium fabrics for everyday and occasion wear.</p>
    </section>

    <!-- PRODUCTS GRID -->
    <section class="category-products">
        <div class="products-grid" id="hijabsGrid">
            <!-- Products loaded via JS -->
        </div>
    </section>

<!-- JS FILES -->
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>

<script>
    const grid = document.getElementById("hijabsGrid");

    const products = (window.products || []).filter(
        p => p.category === "hijabs"
    );

    if (products.length === 0) {
        grid.innerHTML = "<p>No hijabs available.</p>";
    }

    products.forEach(p => {
        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
            <img src="${p.image}" alt="${p.name}">
            <div class="product-info">
                <h3>${p.name}</h3>
                <p>${p.subtitle || "Premium Hijab"}</p>
                <div class="product-price">₹${p.price}</div>
                <div class="product-actions">
                    <button onclick="addToCart('${p.id}')">Add to Cart</button>
                    <button class="secondary" onclick="addToWishlist('${p.id}')">♡</button>
                </div>
            </div>
        `;

        grid.appendChild(card);
    });
    
function searchHijabs() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const cards = document.querySelectorAll(".product-card");

  cards.forEach(card => {
    const title = card.querySelector("h3").innerText.toLowerCase();
    const subtitle = card.querySelector("p").innerText.toLowerCase();

    if (title.includes(input) || subtitle.includes(input)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
const menuToggle = document.getElementById("menuToggle");
const navMenu = document.getElementById("navMenu");
const dropdown = document.querySelector(".nav-dropdown");

menuToggle.addEventListener("click", () => {
  navMenu.classList.toggle("show");
});

// Mobile dropdown click
dropdown.addEventListener("click", e => {
  if (window.innerWidth <= 768) {
    e.preventDefault();
    dropdown.classList.toggle("open");
  }
});


</script>
