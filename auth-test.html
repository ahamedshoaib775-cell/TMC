<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supabase Auth Test</title>
  <style>
    body{font-family:Arial, sans-serif; max-width:700px; margin:40px auto; padding:16px;}
    input{display:block; width:100%; padding:10px; margin:10px 0;}
    button{padding:10px 14px; margin-right:8px;}
    pre{background:#111; color:#0f0; padding:12px; overflow:auto;}
  </style>
</head>
<body>
  <h2>Supabase Auth Test</h2>

  <input id="email" type="email" placeholder="email" />
  <input id="password" type="password" placeholder="password" />

  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Sign In</button>
  <button id="getUserBtn">Get User</button>
  <button id="logoutBtn">Sign Out</button>

  <h3>Result</h3>
  <pre id="out">Ready</pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://zptvwegpiackjssnellc.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwdHZ3ZWdwaWFja2pzc25lbGxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMjEzMDYsImV4cCI6MjA4Mzc5NzMwNn0.V8F2lmDKljgx-EkII2hmiUDg9kuyEgB3-L6lPJatTp0";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const out = document.getElementById("out");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");

    const show = (obj) => out.textContent = JSON.stringify(obj, null, 2);

    document.getElementById("signupBtn").onclick = async () => {
      const email = emailEl.value.trim();
      const password = passEl.value;
      const res = await supabase.auth.signUp({ email, password });
      show(res);
    };

    document.getElementById("loginBtn").onclick = async () => {
      const email = emailEl.value.trim();
      const password = passEl.value;
      const res = await supabase.auth.signInWithPassword({ email, password });
      show(res);
    };

    document.getElementById("getUserBtn").onclick = async () => {
      const res = await supabase.auth.getUser();
      show(res);
    };

    document.getElementById("logoutBtn").onclick = async () => {
      const res = await supabase.auth.signOut();
      show(res);
    };
  </script>
</body>
</html>
