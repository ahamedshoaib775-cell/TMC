<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - TMC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    .navbar { background: rgba(10, 10, 10, 0.95); border-bottom: 1px solid #d4af37; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .navbar-logo { color: #d4af37; font-size: 20px; font-weight: 600; text-decoration: none; }
    .navbar-links a { color: #d4af37; text-decoration: none; margin-left: 30px; font-size: 14px; cursor: pointer; }
    .container { max-width: 800px; margin: 50px auto; padding: 40px; background: linear-gradient(135deg, rgba(26, 26, 26, 0.95) 0%, rgba(20, 20, 20, 0.95) 100%); border: 1px solid #d4af37; border-radius: 12px; box-shadow: 0 8px 32px rgba(212, 175, 55, 0.1); }
    .container h1 { color: #d4af37; margin-bottom: 30px; font-size: 36px; border-bottom: 2px solid #d4af37; padding-bottom: 15px; }
    .user-info { background: rgba(42, 42, 42, 0.5); padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #d4af37; }
    .user-info p { margin: 12px 0; font-size: 16px; }
    .user-info strong { color: #d4af37; }
    .section { margin-bottom: 30px; }
    .section h2 { color: #d4af37; margin-bottom: 15px; font-size: 20px; }
    .section-content { background: rgba(42, 42, 42, 0.3); padding: 15px; border-radius: 8px; border: 1px solid #444; }
    .btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #d4af37 0%, #e5c158 100%); color: #000; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; margin-right: 10px; margin-top: 10px; text-decoration: none; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); }
    .btn-logout { background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%); color: #fff; }
    .btn-logout:hover { box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3); }
    .nav-links { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="index.html" class="navbar-logo">TMC</a>
    <div class="navbar-links">
      <a href="shop.html">Shop</a>
      <a href="account.html">Account</a>
      <a onclick="logout()">Logout</a>
    </div>
  </div>
  
  <div class="container">
    <h1>👤 My Account</h1>
    
    <div class="user-info">
      <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>
      <p><strong>Username:</strong> <span id="user-username">Loading...</span></p>
      <p><strong>Member Since:</strong> <span id="join-date">Loading...</span></p>
    </div>
    
    <div class="section">
      <h2>📦 My Orders</h2>
      <div class="section-content">
        <div id="orders-container"><p style="color: #aaa;">Loading orders...</p></div>
      </div>
    </div>
    
    <div class="section">
      <h2>❤️ My Wishlist</h2>
      <div class="section-content">
        <div id="wishlist-container"><p style="color: #aaa;">Loading wishlist...</p></div>
      </div>
    </div>
    
    <div class="section">
      <h2>⚙️ Account Actions</h2>
      <div class="nav-links">
        <a href="shop.html" class="btn">Continue Shopping</a>
        <button onclick="logout()" class="btn btn-logout">Logout</button>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-config.js"></script>
  <script>
    async function loadUserData() {
      try {
        console.log('Loading user data...');
        const user = await checkAuth();
        
        if (!user) {
          console.log('No user found, redirecting to login');
          window.location.href = 'login.html';
          return;
        }
        
        document.getElementById('user-email').textContent = user.email || 'N/A';
        document.getElementById('user-username').textContent = user.user_metadata?.username || 'User';
        document.getElementById('join-date').textContent = new Date(user.created_at).toLocaleDateString();
        
        console.log('User data loaded successfully');
      } catch (error) {
        console.error('Error loading user data:', error);
        document.getElementById('user-email').textContent = 'Error loading';
      }
    }
    
    // Load data when page loads
    window.addEventListener('load', loadUserData);
  </script>
</body>
</html>
