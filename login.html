<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TMC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-container { width: 100%; max-width: 450px; padding: 40px; background: rgba(20, 20, 20, 0.95); border: 2px solid #d4af37; border-radius: 12px; box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2); }
    .login-container h1 { color: #d4af37; margin-bottom: 10px; font-size: 28px; text-align: center; }
    .login-container p { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: #d4af37; font-weight: 600; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 12px; background: rgba(42, 42, 42, 0.6); border: 1px solid #d4af37; color: #fff; border-radius: 6px; font-size: 14px; }
    .form-group input:focus { outline: none; background: rgba(42, 42, 42, 0.8); box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
    .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #d4af37 0%, #e5c158 100%); color: #000; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; transition: all 0.3s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4); }
    .message { padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px; }
    .message.error { background: rgba(255, 107, 107, 0.1); color: #ff6b6b; border: 1px solid #ff6b6b; }
    .message.success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50; }
    .auth-link { text-align: center; margin-top: 20px; }
    .auth-link a { color: #d4af37; text-decoration: none; cursor: pointer; }
    .auth-link a:hover { text-decoration: underline; }
    .loading { display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🔐 Login</h1>
    <p>Access your TMC account</p>
    
    <div id="messageDiv" class="message" style="display: none;"></div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="your@email.com">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>
      
      <button type="submit" class="btn">Login</button>
    </form>
    
    <div class="auth-link">
      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
    <div class="auth-link">
      <p><a href="index.html">Back to home</a></p>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-config.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('messageDiv');
      
      try {
        messageDiv.style.display = 'none';
        
        if (!supabase) {
          console.error('Supabase not initialized');
          messageDiv.textContent = 'System error. Please refresh and try again.';
          messageDiv.className = 'message error';
          messageDiv.style.display = 'block';
          return;
        }
        
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });
        
        if (error) {
          messageDiv.textContent = 'Login failed: ' + (error.message || 'Unknown error');
          messageDiv.className = 'message error';
          messageDiv.style.display = 'block';
          console.error('Login error:', error);
          return;
        }
        
        if (data && data.user) {
          messageDiv.textContent = 'Login successful! Redirecting...';
          messageDiv.className = 'message success';
          messageDiv.style.display = 'block';
          
          // Store session info
          localStorage.setItem('auth_token', data.session?.access_token || '');
          localStorage.setItem('user_id', data.user.id);
          
          setTimeout(() => {
            window.location.href = 'account.html';
          }, 1000);
        }
      } catch (error) {
        messageDiv.textContent = 'Error: ' + error.message;
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
        console.error('Login error:', error);
      }
    }
  </script>
</body>
</html>
