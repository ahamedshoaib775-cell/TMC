<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login - TMC</title>
 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }
 body {
 background: #0a0a0a url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%230a0a0a" width="100" height="100"/><path fill="%23111" d="M0 0h100v100H0z" opacity=".05"/></svg>');
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 color: #fff;
 }
 .navbar {
 position: absolute;
 top: 0;
 left: 0;
 right: 0;
 background: rgba(10, 10, 10, 0.95);
 border-bottom: 1px solid #d4af37;
 padding: 15px 30px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 z-index: 100;
 }
 .navbar-logo {
 color: #d4af37;
 font-size: 20px;
 font-weight: 600;
 text-decoration: none;
 }
 .navbar-links a {
 color: #d4af37;
 text-decoration: none;
 margin-left: 30px;
 font-size: 14px;
 transition: color 0.3s;
 }
 .navbar-links a:hover {
 color: #e5c158;
 }
 .auth-container {
 background: linear-gradient(135deg, rgba(26, 26, 26, 0.95) 0%, rgba(20, 20, 20, 0.95) 100%);
 padding: 50px;
 border-radius: 12px;
 width: 100%;
 max-width: 420px;
 border: 1px solid #d4af37;
 box-shadow: 0 8px 32px rgba(212, 175, 55, 0.1);
 margin-top: 80px;
 }
 .auth-container h2 {
 color: #d4af37;
 text-align: center;
 margin-bottom: 30px;
 font-size: 32px;
 font-weight: 600;
 }
 .form-group {
 margin-bottom: 20px;
 }
 .form-group label {
 display: block;
 color: #d4af37;
 font-weight: 500;
 margin-bottom: 10px;
 font-size: 14px;
 }
 .form-group input {
 width: 100%;
 padding: 14px;
 background: rgba(42, 42, 42, 0.8);
 border: 1px solid #444;
 border-radius: 6px;
 color: #fff;
 font-size: 14px;
 transition: all 0.3s;
 }
 .form-group input:focus {
 outline: none;
 border-color: #d4af37;
 box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
 background: rgba(42, 42, 42, 1);
 }
 .btn-submit {
 width: 100%;
 padding: 14px;
 background: linear-gradient(135deg, #d4af37 0%, #e5c158 100%);
 color: #000;
 border: none;
 border-radius: 6px;
 font-weight: 600;
 cursor: pointer;
 font-size: 16px;
 transition: all 0.3s;
 margin-top: 10px;
 }
 .btn-submit:hover {
 transform: translateY(-2px);
 box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
 }
 .btn-submit:disabled {
 opacity: 0.6;
 cursor: not-allowed;
 }
 .message {
 margin-top: 15px;
 padding: 12px;
 border-radius: 6px;
 text-align: center;
 font-size: 14px;
 display: none;
 }
 .message.error {
 background: rgba(255, 107, 107, 0.2);
 color: #ff6b6b;
 border: 1px solid #ff6b6b;
 display: block;
 }
 .message.success {
 background: rgba(81, 207, 102, 0.2);
 color: #51cf66;
 border: 1px solid #51cf66;
 display: block;
 }
 .switch-auth {
 text-align: center;
 margin-top: 25px;
 color: #888;
 font-size: 14px;
 }
 .switch-auth a {
 color: #d4af37;
 cursor: pointer;
 text-decoration: none;
 font-weight: 600;
 }
 .switch-auth a:hover {
 text-decoration: underline;
 }
 .loading {
 display: none;
 text-align: center;
 color: #d4af37;
 }
 .loader {
 border: 3px solid #333;
 border-top: 3px solid #d4af37;
 border-radius: 50%;
 width: 30px;
 height: 30px;
 animation: spin 0.8s linear infinite;
 margin: 0 auto 10px;
 }
 @keyframes spin {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
 }
 </style>
</head>
<body>
 <div class="navbar">
 <a href="index.html" class="navbar-logo">TMC</a>
 <div class="navbar-links">
 <a href="index.html">Home</a>
 <a href="register.html">Register</a>
 </div>
 </div>
 <div class="auth-container">
 <h2>Login</h2>
 <form id="login-form">
 <div class="form-group">
 <label for="email">Email</label>
 <input type="email" id="email" name="email" placeholder="your@email.com" required />
 </div>
 <div class="form-group">
 <label for="password">Password</label>
 <input type="password" id="password" name="password" placeholder="Enter password" required />
 </div>
 <div class="loading" id="loading">
 <div class="loader"></div>
 <p>Logging in...</p>
 </div>
 <button type="submit" class="btn-submit" id="submit-btn">Login</button>
 </form>
 <div id="message" class="message"></div>
 <div class="switch-auth">
 Don't have an account? <a href="register.html">Register here</a>
 </div>
 </div>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script>
 // ===== CONFIGURE THESE TWO VALUES =====
 const SUPABASE_URL = 'https://zptvwegpiackjssnellc.supabase.co';
 const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwdHZ3ZWdwaWFja2pzc25lbGxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMjEzMDYsImV4cCI6MjA4Mzc5NzMwNn0.V8F2lmDKljgx-EkII2hmiUDg9kuyEgB3-L6lPJatTp0';
 // =====================================
 const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 document.getElementById('login-form').addEventListener('submit', async (e) => {
 e.preventDefault();
 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('password').value;
 const messageDiv = document.getElementById('message');
 const loadingDiv = document.getElementById('loading');
 const submitBtn = document.getElementById('submit-btn');
 loadingDiv.style.display = 'block';
 submitBtn.disabled = true;
 try {
 const { data, error } = await supabase.auth.signInWithPassword({
 email: email,
 password: password
 });
 if (error) throw new Error(error.message);
 messageDiv.className = 'message success';
 messageDiv.textContent = '✅ Login successful! Redirecting...';
 localStorage.setItem('user_id', data.user.id);
 localStorage.setItem('user_email', data.user.email);
 setTimeout(() => {
 window.location.href = 'account.html';
 }, 1500);
 } catch (error) {
 messageDiv.className = 'message error';
 messageDiv.textContent = `❌ ${error.message}`;
 loadingDiv.style.display = 'none';
 submitBtn.disabled = false;
 }
 });
 </script>
</body>
</html>
